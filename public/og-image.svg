<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="og-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="60%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#8B0A1F"/>
    </linearGradient>
    <pattern id="og-stripes" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#C8102E" stroke-width="1" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Black background -->
  <rect width="1200" height="630" fill="#09090B"/>
  <rect width="1200" height="630" fill="url(#og-stripes)"/>

  <!-- Red diagonal section (right side) -->
  <path d="M 720 0 L 1200 0 L 1200 630 L 600 630 Z" fill="#C8102E"/>
  <path d="M 760 0 L 1200 0 L 1200 630 L 640 630 Z" fill="#8B0A1F" opacity="0.4"/>

  <!-- Red horizontal speed lines (left side) -->
  <g opacity="0.6">
    <line x1="-50" y1="180" x2="500" y2="180" stroke="#C8102E" stroke-width="4" transform="rotate(-15 250 180)"/>
    <line x1="-50" y1="220" x2="450" y2="220" stroke="#C8102E" stroke-width="2" transform="rotate(-15 250 220)"/>
  </g>

  <!-- Top red bar -->
  <rect x="0" y="0" width="1200" height="8" fill="#C8102E"/>

  <!-- Bottom info bar -->
  <rect x="0" y="566" width="1200" height="64" fill="#09090B" opacity="0.95"/>
  <line x1="0" y1="566" x2="1200" y2="566" stroke="#C8102E" stroke-width="2"/>

  <!-- LEFT SIDE: Text content -->
  <g transform="translate(80, 130)">
    <!-- Location label -->
    <g>
      <line x1="0" y1="0" x2="40" y2="0" stroke="#C8102E" stroke-width="2"/>
      <text x="55" y="6"
            font-family="'JetBrains Mono', monospace"
            font-size="16"
            font-weight="700"
            fill="#C8102E"
            letter-spacing="4">VILLA CARLOS PAZ · CÓRDOBA</text>
    </g>

    <!-- Main headline -->
    <text x="0" y="115"
          font-family="'Bebas Neue', Impact, sans-serif"
          font-size="100"
          font-weight="900"
          fill="#FFFFFF"
          letter-spacing="2">POTENCIA</text>

    <text x="0" y="220"
          font-family="'Bebas Neue', Impact, sans-serif"
          font-size="100"
          font-weight="900"
          fill="#C8102E"
          letter-spacing="2">CONFIANZA</text>

    <text x="0" y="325"
          font-family="'Bebas Neue', Impact, sans-serif"
          font-size="100"
          font-weight="900"
          fill="#FFFFFF"
          letter-spacing="2">VELOCIDAD</text>
  </g>

  <!-- RIGHT SIDE: Logo -->
  <g transform="translate(870, 200)">
    <!-- White box behind logo -->
    <rect x="-10" y="-10" width="260" height="240" fill="#FFFFFF"/>
    <!-- Border accent -->
    <rect x="-25" y="-25" width="290" height="270" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>

    <!-- Logo: RB letters -->
    <g transform="translate(40, 30) scale(0.9)">
      <path d="M 0 0 L 0 110 L 24 110 L 24 80 L 36 80 L 56 110 L 88 110 L 64 78 Q 86 70 86 45 Q 86 0 50 0 Z M 24 22 L 42 22 Q 62 22 62 42 Q 62 60 42 60 L 24 60 Z"
            fill="url(#og-grad)"
            transform="skewX(-10)"/>
      <path d="M 110 0 L 110 110 L 162 110 Q 192 110 192 82 Q 192 60 178 55 Q 188 48 188 32 Q 188 0 158 0 Z M 134 22 L 152 22 Q 164 22 164 36 Q 164 48 152 48 L 134 48 Z M 134 66 L 158 66 Q 170 66 170 82 Q 170 92 158 92 L 134 92 Z"
            fill="url(#og-grad)"
            transform="skewX(-10)"/>
    </g>

    <!-- RACING text -->
    <g transform="translate(35, 160)">
      <line x1="0" y1="0" x2="180" y2="0" stroke="#18181B" stroke-width="3"/>
      <text x="90" y="32"
            text-anchor="middle"
            font-family="'Bebas Neue', Impact, sans-serif"
            font-size="32"
            font-weight="900"
            fill="#18181B"
            letter-spacing="6"
            style="font-style: italic;">RACING</text>
      <line x1="0" y1="48" x2="180" y2="48" stroke="#18181B" stroke-width="2"/>
    </g>
  </g>

  <!-- Bottom info bar text -->
  <g transform="translate(80, 605)">
    <circle cx="6" cy="-3" r="5" fill="#C8102E"/>
    <text x="22" y="0"
          font-family="'JetBrains Mono', monospace"
          font-size="15"
          font-weight="500"
          fill="#FFFFFF"
          letter-spacing="2">MECÁNICA · COMPETICIÓN · ELECTROMECÁNICA</text>
  </g>
  <g transform="translate(1120, 605)">
    <text x="0" y="0"
          text-anchor="end"
          font-family="'JetBrains Mono', monospace"
          font-size="15"
          font-weight="500"
          fill="#A1A1AA"
          letter-spacing="2">RBRACING.COM.AR</text>
  </g>
</svg>
